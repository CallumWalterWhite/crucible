description: ORDER BY DESC puts +inf first, then numbers, -inf, NaN and NULL last.
  See https://cloud.google.com/bigquery/docs/reference/standard-sql/data-types#floating_point_semantics.
tags:
- probe
- ordering
- nan
query: SELECT x FROM UNNEST([1.0, CAST('inf' AS FLOAT64), CAST('nan' AS FLOAT64),
  NULL, CAST('-inf' AS FLOAT64)]) AS x ORDER BY x DESC
ordered: true
expected:
  columns:
  - name: x
    type: FLOAT64
  rows:
  - - Infinity
  - - 1.0
  - - -Infinity
  - - NaN
  - - null
