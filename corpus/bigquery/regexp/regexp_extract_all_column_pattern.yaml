description: REGEXP_EXTRACT_ALL takes the RE2 pattern from a column, so each row uses
  its own pattern. See https://cloud.google.com/bigquery/docs/reference/standard-sql/string_functions#regexp_extract_all.
tags:
- probe
- regexp
setup:
- CREATE TABLE r (s STRING, p STRING)
- INSERT INTO r VALUES ('a1b22', '[0-9]+'), ('xyz', '[a-z]')
query: SELECT REGEXP_EXTRACT_ALL(s, p) AS v FROM r
ordered: false
expected:
  columns:
  - name: v
    type: ARRAY<STRING>
  rows:
  - - - '1'
      - '22'
  - - - x
      - y
      - z
verified: true
recorded_at: '2026-10-21T12:39:25Z'
