description: REGEXP_CONTAINS takes the RE2 pattern from a column, so each row uses
  its own pattern. See https://cloud.google.com/bigquery/docs/reference/standard-sql/string_functions#regexp_contains.
tags:
- probe
- regexp
setup:
- CREATE TABLE r (s STRING, p STRING)
- INSERT INTO r VALUES ('abc', 'b'), ('abc', 'z')
query: SELECT REGEXP_CONTAINS(s, p) AS v FROM r
ordered: false
expected:
  columns:
  - name: v
    type: BOOL
