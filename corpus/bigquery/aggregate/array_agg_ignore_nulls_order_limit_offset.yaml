description: ARRAY_AGG IGNORE NULLS with ORDER BY and LIMIT, then SAFE_OFFSET, returns NULL for a group with no non-NULL values. See https://cloud.google.com/bigquery/docs/reference/standard-sql/aggregate_functions. Expected value from the BigQuery documentation; not yet recorded.
tags: [slice2, aggregate]
setup: ['CREATE TABLE t (k STRING, x INT64, y INT64)', 'INSERT INTO t VALUES (''k1'', NULL, 5), (''k1'', 2, 1), (''k1'', 3, 9), (''k2'', NULL, 1)']
query: SELECT k, ARRAY_AGG(x IGNORE NULLS ORDER BY y DESC LIMIT 1)[SAFE_OFFSET(0)] AS v FROM t GROUP BY k
ordered: false
expected:
  columns:
  - {name: k, type: STRING}
  - {name: v, type: INT64}
  rows:
  - [k1, 3]
  - [k2, null]
verified: false
