description: MIN and MAX return NaN when the input contains NaN. See
  https://cloud.google.com/bigquery/docs/reference/standard-sql/aggregate_functions#min.
tags:
- probe
- aggregate
query: SELECT MIN(x) AS mn, MAX(x) AS mx FROM UNNEST([1.0, CAST('nan' AS FLOAT64), 2.0]) AS x
expected:
  columns:
  - {name: mn, type: FLOAT64}
  - {name: mx, type: FLOAT64}
  rows:
  - [NaN, NaN]
