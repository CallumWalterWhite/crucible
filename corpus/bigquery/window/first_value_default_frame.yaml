description: FIRST_VALUE with ORDER BY and no frame returns the first value of the frame, which runs from the first row to the current row, so the first row's value is repeated.
tags:
- probe
- window
query: SELECT x, FIRST_VALUE(x) OVER (ORDER BY x) AS v FROM UNNEST([2, 1, 3]) AS x ORDER BY x
ordered: true
expected:
  columns:
  - name: x
    type: INT64
  - name: v
    type: INT64
  rows:
  - - 1
    - 1
  - - 2
    - 1
  - - 3
    - 1
