description: Wildcard rules (*.ck) and exception rules (!www.ck, !city.kawasaki.jp) apply. See https://cloud.google.com/bigquery/docs/reference/standard-sql/net_functions#netreg_domain.
tags:
- net
query: SELECT NET.REG_DOMAIN('a.b.ck') AS d0, NET.REG_DOMAIN('www.ck') AS d1, NET.REG_DOMAIN('www.city.kawasaki.jp')
  AS d2
ordered: false
expected:
  columns:
  - name: d0
    type: STRING
  - name: d1
    type: STRING
  - name: d2
    type: STRING
  rows:
  - - a.b.ck
    - www.ck
    - city.kawasaki.jp
