description: DECLARE with a DEFAULT sets the variable, and a later statement reads it. See https://cloud.google.com/bigquery/docs/reference/standard-sql/procedural-language#declare.
tags: [scripting]
query: DECLARE x INT64 DEFAULT 5; SELECT x * 2 AS v
expected:
  columns:
  - {name: v, type: INT64}
  rows:
  - [10]
