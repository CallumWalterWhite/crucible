description: MERGE raises a runtime error when a target row matches more than one
  source row. See https://cloud.google.com/bigquery/docs/reference/standard-sql/dml-syntax.
tags:
- slice2
- statements
setup:
- CREATE TABLE tgt (k INT64, v STRING)
- CREATE TABLE src (k INT64, v STRING)
- INSERT INTO tgt VALUES (1, 'old')
- INSERT INTO src VALUES (1, 'a'), (1, 'b')
query: MERGE INTO tgt AS d USING src AS s ON s.k = d.k WHEN MATCHED THEN UPDATE SET
  v = s.v
ordered: false
expected:
  error:
    kind: runtime
    message: UPDATE/MERGE must match at most one source row for each target row
    message_contains: must match at most one source row
verified: true
recorded_at: '2026-10-15T11:17:09Z'
