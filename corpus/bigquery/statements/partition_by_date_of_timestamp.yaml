description: DATE(<timestamp column>) partitions a table by day. See https://cloud.google.com/bigquery/docs/creating-partitioned-tables.
tags:
- ddl
- partitioning
setup:
- CREATE TABLE p_ts (ts TIMESTAMP, v INT64) PARTITION BY DATE(ts)
- INSERT INTO p_ts VALUES (TIMESTAMP '2024-01-01 10:00:00+00', 1), (TIMESTAMP '2024-01-02 10:00:00+00', 2)
query: SELECT COUNT(*) AS n FROM p_ts
expected:
  columns:
  - name: n
    type: INT64
  rows:
  - - 2
