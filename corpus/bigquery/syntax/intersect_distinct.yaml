description: INTERSECT DISTINCT returns the distinct rows present in both queries. See https://cloud.google.com/bigquery/docs/reference/standard-sql/query-syntax#set_operators.
tags:
- probe
- syntax
query: SELECT x FROM UNNEST([1, 1, 2, 3]) AS x INTERSECT DISTINCT SELECT x FROM UNNEST([1, 3, 3]) AS x
ordered: false
expected:
  columns:
  - name: x
    type: INT64
  rows:
  - - 1
  - - 3
