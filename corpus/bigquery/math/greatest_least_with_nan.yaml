query: SELECT GREATEST(1.0, CAST('nan' AS FLOAT64)) AS g, LEAST(1.0, CAST('nan' AS
  FLOAT64)) AS l, LEAST(CAST(NULL AS FLOAT64), CAST('nan' AS FLOAT64)) AS n
