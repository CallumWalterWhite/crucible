description: UNNEST of an array of STRUCT with an alias exposes the struct fields
  as x.m and x.v.
tags:
- slice2
- unnest
setup:
- CREATE TABLE t (id INT64, a INT64, b INT64)
- INSERT INTO t VALUES (1, 5, 0), (2, 0, 7)
query: SELECT t.id, x.m, x.v FROM t, UNNEST([STRUCT('a' AS m, a AS v), STRUCT('b'
  AS m, b AS v)]) AS x WHERE x.v > 0
ordered: false
expected:
  columns:
  - name: id
    type: INT64
  - name: m
    type: STRING
  - name: v
    type: INT64
  rows:
  - - 1
    - a
    - 5
  - - 2
    - b
    - 7
verified: true
recorded_at: '2026-10-15T11:18:25Z'
