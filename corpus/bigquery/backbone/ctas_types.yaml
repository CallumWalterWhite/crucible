description: CREATE TABLE AS SELECT keeps the type of each selected expression. A
  table created with CTAS keeps the INT64, FLOAT64 and NUMERIC types of its select
  list.
tags:
- backbone
- ddl
setup:
- CREATE TABLE t AS SELECT 1 AS i, 2.5 AS f, NUMERIC '1.5' AS n
query: SELECT * FROM t
ordered: false
expected:
  columns:
  - name: i
    type: INT64
  - name: f
    type: FLOAT64
  - name: n
    type: NUMERIC
  rows:
  - - 1
    - 2.5
    - '1.5'
verified: true
recorded_at: '2026-10-15T11:11:54Z'
