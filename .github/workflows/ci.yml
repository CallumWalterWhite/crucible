name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-extras --group dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run lint-imports

  corpus-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Only corpus-record/ branches may set verified true (ADR 0013)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: scripts/check-corpus-verified.sh "$BASE_SHA" "$HEAD_REF"

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-extras --python ${{ matrix.python }}
      - run: uv run pytest

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          tags: crucible:ci
          load: true
          push: false
      - name: Start emulators and wait for health
        run: |
          wait_for_health() {  # <container> <port>
            for _ in $(seq 60); do
              if curl -fsS --max-time 2 "http://127.0.0.1:$2/_crucible/health" >/dev/null; then
                echo "$1 healthy on port $2"
                return 0
              fi
              sleep 1
            done
            echo "$1 not healthy after 60s" >&2
            docker logs "$1" >&2 || true
            return 1
          }
          # The image sets CRUCIBLE_HOST=0.0.0.0, so the server listens on all container interfaces.
          docker run -d --name crucible-bigquery -p 127.0.0.1:9050:9050 \
            crucible:ci serve --dialect bigquery --port 9050
          docker run -d --name crucible-snowflake -p 127.0.0.1:8080:8080 \
            crucible:ci serve --dialect snowflake --port 8080
          wait_for_health crucible-bigquery 9050
          wait_for_health crucible-snowflake 8080

  clients:
    needs: docker
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - dialect: bigquery
            port: 9050
            client: google-cloud-bigquery==3.27.0
          - dialect: bigquery
            port: 9050
            client: google-cloud-bigquery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          tags: crucible:ci
          load: true
          push: false
      - name: Start emulator and wait for health
        env:
          DIALECT: ${{ matrix.dialect }}
          PORT: ${{ matrix.port }}
        run: |
          docker run -d --name crucible -p "127.0.0.1:${PORT}:${PORT}" \
            crucible:ci serve --dialect "$DIALECT" --port "$PORT"
          for _ in $(seq 60); do
            if curl -fsS --max-time 2 "http://127.0.0.1:${PORT}/_crucible/health" >/dev/null; then
              echo "healthy on port ${PORT}"
              exit 0
            fi
            sleep 1
          done
          echo "not healthy after 60s" >&2
          docker logs crucible >&2 || true
          exit 1
      - name: Run official client tests
        env:
          CLIENT_SPEC: ${{ matrix.client }}
          DIALECT: ${{ matrix.dialect }}
          CRUCIBLE_URL: http://127.0.0.1:${{ matrix.port }}
        run: uv run --with "$CLIENT_SPEC" pytest -m clients tests/clients -k "$DIALECT"

  dbt:
    needs: docker
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - dialect: bigquery
            port: 9050
            core: dbt-core==1.9.11
            adapter: dbt-bigquery==1.9.0
          - dialect: bigquery
            port: 9050
            core: dbt-core
            adapter: dbt-bigquery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          tags: crucible:ci
          load: true
          push: false
      - name: Start emulator and wait for health
        env:
          DIALECT: ${{ matrix.dialect }}
          PORT: ${{ matrix.port }}
        run: |
          docker run -d --name crucible -p "127.0.0.1:${PORT}:${PORT}" \
            crucible:ci serve --dialect "$DIALECT" --port "$PORT"
          for _ in $(seq 60); do
            if curl -fsS --max-time 2 "http://127.0.0.1:${PORT}/_crucible/health" >/dev/null; then
              echo "healthy on port ${PORT}"
              exit 0
            fi
            sleep 1
          done
          echo "not healthy after 60s" >&2
          docker logs crucible >&2 || true
          exit 1
      - name: Run dbt tests
        env:
          CORE_SPEC: ${{ matrix.core }}
          ADAPTER_SPEC: ${{ matrix.adapter }}
          DIALECT: ${{ matrix.dialect }}
          CRUCIBLE_URL: http://127.0.0.1:${{ matrix.port }}
        run: uv run --with "$CORE_SPEC" --with "$ADAPTER_SPEC" pytest -m dbt tests/dbt -k "$DIALECT"
