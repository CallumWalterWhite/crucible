name: Bug report
description: Crucible returns a different result or error than real BigQuery, or crashes.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include credentials, project IDs or private data.
        For an "unsupported" error, use the "Unsupported feature" template instead.
  - type: textarea
    id: query
    attributes:
      label: Query or request
      description: The smallest SQL (or API call) that shows the problem, with any CREATE TABLE / INSERT it needs.
      render: sql
    validations:
      required: true
  - type: textarea
    id: bigquery
    attributes:
      label: What real BigQuery returns
      description: Rows, types or the exact error message. Say if you have not checked against BigQuery.
    validations:
      required: true
  - type: textarea
    id: crucible
    attributes:
      label: What Crucible returns
      description: Rows, types or the exact error message.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Crucible version
      description: The Docker tag or `pip show crucible-emulator` version, or the commit if built from source.
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
      description: For example google-cloud-bigquery 3.46.1, dbt-core 1.12.6 with dbt-bigquery 1.12.1, or curl.
