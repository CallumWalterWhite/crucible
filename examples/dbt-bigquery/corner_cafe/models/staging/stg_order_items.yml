version: 2

models:
  - name: stg_order_items
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_sku
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_sku
