name: bigquery_smoke
version: "1.0.0"
config-version: 2

profile: bigquery_smoke

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

# Descriptions go to the warehouse (persist_docs) and labels into each relation's OPTIONS, so
# tests/dbt/test_dbt_bigquery.py can read them back with get_table.
models:
  bigquery_smoke:
    +persist_docs:
      relation: true
      columns: true
    +labels:
      team: data
    # insert_overwrite and microbatch models, enabled only by test_bigquery_partition_strategies
    # (--vars '{partitions: true}'), which writes their source and bounds the microbatch window.
    partitions:
      +enabled: "{{ var('partitions', false) }}"
