version: 2

seeds:
  - name: customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: tier
        data_tests:
          - accepted_values:
              values: ["gold", "silver", "bronze"]

models:
  - name: vip_customers
    description: Customers flagged as VIP, with their credit limit.
    columns:
      - name: customer_id
        description: The customer's id, as in the customers seed.
        data_tests:
          - relationships:
              to: ref('customers')
              field: customer_id
      - name: name
        description: The customer's name.
      - name: credit_limit
        description: The credit limit in dollars.
  - name: customer_signups
    description: The signup date of each customer, merged on customer_id.
    columns:
      - name: customer_id
        description: The customer's id, as in the customers seed.
        data_tests:
          - unique
          - not_null
      - name: name
        description: The customer's name.
      - name: signup_date
        description: The day the customer signed up.

unit_tests:
  - name: vip_customers_keeps_only_vips
    model: vip_customers
    given:
      - input: ref('customers')
        rows:
          - {customer_id: 1, name: Ada, credit_limit: 1500.0, is_vip: true}
          - {customer_id: 2, name: Grace, credit_limit: 900.5, is_vip: false}
    expect:
      rows:
        - {customer_id: 1, name: Ada, credit_limit: 1500.0}
